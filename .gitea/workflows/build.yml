name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        # The npm 10 client bundled with Node 22 uses the retired quick-audit
        # endpoint, which now rejects otherwise valid lockfiles. Keep the
        # runtime pinned while using the current bulk-advisory client.
        run: npx --yes npm@11.16.0 audit --omit=dev --audit-level=critical

  publish-image:
    if: gitea.event_name == 'push' && startsWith(gitea.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Docker CLI
        shell: sh
        run: |
          apt-get update
          apt-get install --yes curl docker.io jq
          docker version
      - name: Log in to Gitea Container Registry
        shell: sh
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ gitea.repository_owner }}
        run: |
          registry="${GITEA_SERVER_URL#*://}"
          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login "${registry}" --username "${REGISTRY_USERNAME}" --password-stdin
      - name: Build and push image
        shell: sh
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          IMAGE_BRANCH: ${{ gitea.ref_name }}
          REGISTRY_OWNER: ${{ gitea.repository_owner }}
          SOURCE_COMMIT: ${{ gitea.sha }}
        run: |
          registry="${GITEA_SERVER_URL#*://}"
          image="${registry}/${REGISTRY_OWNER}/spendee"
          branch_tag="$(printf '%s' "${IMAGE_BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')"
          docker build --build-arg APP_VERSION="${SOURCE_COMMIT}" --tag "${image}:${branch_tag}" .
          docker push "${image}:${branch_tag}"
      - name: Remove obsolete package versions
        if: gitea.ref == 'refs/heads/main'
        shell: sh
        env:
          GITEA_API_URL: ${{ gitea.api_url }}
          REGISTRY_OWNER: ${{ gitea.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          versions="$(curl --fail --silent --show-error \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_API_URL}/packages/${REGISTRY_OWNER}?type=container&q=spendee&limit=100")"
          printf '%s' "${versions}" \
            | jq -r '.[] | select(.name == "spendee" and .version != "main") | .version' \
            | while IFS= read -r version; do
                status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                  --request DELETE \
                  --header "Authorization: token ${REGISTRY_TOKEN}" \
                  "${GITEA_API_URL}/packages/${REGISTRY_OWNER}/container/spendee/${version}")"
                [ "${status}" = "204" ] || [ "${status}" = "404" ]
              done
