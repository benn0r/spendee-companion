name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest-slim
    container: node:22.22.1-bookworm
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ gitea.sha }}
        run: npm run build
      - name: Validate production runtime
        run: npm run verify:runtime
      - name: Package production build
        run: |
          mkdir -p build-artifact/.next
          cp -R .next/standalone/. build-artifact/
          cp -R .next/static build-artifact/.next/static
          cp -R public build-artifact/public
          tar --create --gzip --file spendee-build.tgz build-artifact
      - name: Upload production build
        uses: actions/upload-artifact@v3
        with:
          name: spendee-build-${{ gitea.run_id }}
          path: spendee-build.tgz
          if-no-files-found: error
      - name: Audit production dependencies
        shell: sh
        run: |
          audit_log="$(mktemp)"
          if npx --yes npm@11.16.0 audit --omit=dev --audit-level=high >"${audit_log}" 2>&1; then
            cat "${audit_log}"
            exit 0
          fi
          cat "${audit_log}"
          if grep -Eq 'audit endpoint returned an error|invalid json response body|Bad Request.*security/advisories' "${audit_log}"; then
            echo '::warning::npm advisory service was unavailable or returned a malformed response'
            exit 0
          fi
          exit 1

  test:
    needs: build
    runs-on: ubuntu-latest-slim
    container: node:22.22.1-bookworm
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Download production build
        uses: actions/download-artifact@v3
        with:
          name: spendee-build-${{ gitea.run_id }}
      - name: Validate production build artifact
        run: |
          tar --extract --gzip --file spendee-build.tgz
          test -f build-artifact/server.js
          test -d build-artifact/.next/static
          test -d build-artifact/public
          node scripts/verify-runtime-build.mjs build-artifact
      - name: Unit and coverage tests
        run: npm run test:coverage

  test-e2e:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - mobile-chromium
    runs-on: ubuntu-latest-slim
    container:
      image: ${{ vars.PLAYWRIGHT_IMAGE }}
      credentials:
        username: ${{ gitea.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Install dependencies
        run: npm ci
      - name: Download production build
        uses: actions/download-artifact@v3
        with:
          name: spendee-build-${{ gitea.run_id }}
      - name: Extract production build
        run: tar --extract --gzip --file spendee-build.tgz
      - name: End-to-end tests
        env:
          PLAYWRIGHT_USE_PRODUCTION_BUILD: "1"
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Upload end-to-end results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: spendee-e2e-${{ gitea.run_id }}-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          if-no-files-found: error

  publish-image:
    needs:
      - test
      - test-e2e
    if: >-
      (gitea.event_name == 'push' || gitea.event_name == 'workflow_dispatch') &&
      startsWith(gitea.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare image publishing tools
        shell: sh
        run: |
          packages=""
          command -v curl >/dev/null 2>&1 || packages="${packages} curl"
          command -v docker >/dev/null 2>&1 || packages="${packages} docker.io"
          command -v jq >/dev/null 2>&1 || packages="${packages} jq"

          # Hosted runners already provide Moby. Keep it instead of replacing it
          # with docker.io, and retain a fallback for leaner future runner images.
          if [ -n "${packages}" ]; then
            apt-get update
            apt-get install --yes ${packages}
          fi

          docker version
      - name: Log in to Gitea Container Registry
        shell: sh
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ gitea.repository_owner }}
        run: |
          registry="${GITEA_SERVER_URL#*://}"
          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login "${registry}" --username "${REGISTRY_USERNAME}" --password-stdin
      - name: Build and push image
        shell: sh
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          IMAGE_BRANCH: ${{ gitea.ref_name }}
          REGISTRY_OWNER: ${{ gitea.repository_owner }}
          SOURCE_COMMIT: ${{ gitea.sha }}
        run: |
          registry="${GITEA_SERVER_URL#*://}"
          image="${registry}/${REGISTRY_OWNER}/spendee"
          branch_tag="$(printf '%s' "${IMAGE_BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')"
          docker build --build-arg APP_VERSION="${SOURCE_COMMIT}" --tag "${image}:${branch_tag}" .
          docker run --rm --entrypoint node "${image}:${branch_tag}" \
            scripts/verify-runtime-build.mjs /app
          docker push "${image}:${branch_tag}"

  deploy:
    name: Deploy to Coolify
    needs:
      - publish-image
    if: >-
      (gitea.event_name == 'push' || gitea.event_name == 'workflow_dispatch') &&
      startsWith(gitea.ref, 'refs/heads/') &&
      gitea.ref_name == vars.COOLIFY_DEPLOY_BRANCH
    runs-on: ubuntu-latest-slim
    timeout-minutes: 10
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Install deployment client
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl jq

      - name: Validate deployment configuration
        run: |
          set -eu
          test -n "${COOLIFY_API_URL}" || {
            echo "Missing Gitea variable: COOLIFY_API_URL" >&2
            exit 1
          }
          test -n "${COOLIFY_RESOURCE_UUID}" || {
            echo "Missing Gitea variable: COOLIFY_RESOURCE_UUID" >&2
            exit 1
          }
          test -n "${COOLIFY_API_TOKEN}" || {
            echo "Missing Gitea secret: COOLIFY_API_TOKEN" >&2
            exit 1
          }

      - name: Trigger and verify Coolify deployment
        run: |
          set -eu
          api_origin="${COOLIFY_API_URL%/}"
          trigger_response="$(mktemp)"
          deployment_response="$(mktemp)"
          trap 'rm -f "${trigger_response}" "${deployment_response}"' EXIT

          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output "${trigger_response}" \
            --get \
            --url "${api_origin}/api/v1/deploy" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --data-urlencode "uuid=${COOLIFY_RESOURCE_UUID}" \
            --data-urlencode "force=false"

          if ! deployment_uuid="$(
            jq --exit-status --raw-output \
              '.deployments[0].deployment_uuid | select(type == "string" and length > 0)' \
              "${trigger_response}"
          )"; then
            echo "Coolify did not return a deployment reference" >&2
            exit 1
          fi

          poll_started_at="$(date +%s)"
          poll_timeout_seconds=420
          previous_status=""

          while :; do
            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "${deployment_response}" \
              --url "${api_origin}/api/v1/deployments/${deployment_uuid}" \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}"

            if ! deployment_status="$(
              jq --exit-status --raw-output \
                '.status | select(type == "string" and length > 0)' \
                "${deployment_response}"
            )"; then
              echo "Coolify returned a deployment without a valid status" >&2
              exit 1
            fi

            if [ "${deployment_status}" != "${previous_status}" ]; then
              echo "Coolify deployment status: ${deployment_status}"
              previous_status="${deployment_status}"
            fi

            case "${deployment_status}" in
              finished)
                echo "Coolify deployment finished successfully"
                exit 0
                ;;
              failed | cancelled-by-user)
                echo "Coolify deployment ended with status: ${deployment_status}" >&2
                exit 1
                ;;
              queued | in_progress)
                ;;
              *)
                echo "Coolify returned an unexpected deployment status" >&2
                exit 1
                ;;
            esac

            current_time="$(date +%s)"
            elapsed_seconds=$((current_time - poll_started_at))
            if [ "${elapsed_seconds}" -ge "${poll_timeout_seconds}" ]; then
              echo "Timed out waiting for Coolify deployment" >&2
              exit 1
            fi

            sleep 5
          done
