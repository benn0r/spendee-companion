name: Clean up branch image

on:
  delete:
  pull_request:
    types:
      - closed

jobs:
  deleted-branch:
    if: gitea.event_name == 'delete' && gitea.event.ref_type == 'branch'
    runs-on: ubuntu-latest-slim
    steps:
      - name: Install curl
        run: |
          apt-get update
          apt-get install --yes curl
      - name: Delete branch image tag
        shell: sh
        env:
          BRANCH_NAME: ${{ gitea.event.ref }}
          GITEA_API_URL: ${{ gitea.api_url }}
          REGISTRY_OWNER: ${{ gitea.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          branch_name="${BRANCH_NAME#refs/heads/}"
          branch_tag="$(printf '%s' "${branch_name}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request DELETE \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_API_URL}/packages/${REGISTRY_OWNER}/container/spendee/${branch_tag}")"
          [ "${status}" = "204" ] || [ "${status}" = "404" ]

  merged-branch:
    if: gitea.event_name == 'pull_request' && gitea.event.pull_request.merged == true
    runs-on: ubuntu-latest-slim
    steps:
      - name: Install curl
        run: |
          apt-get update
          apt-get install --yes curl
      - name: Delete merged branch image tag
        shell: sh
        env:
          BRANCH_NAME: ${{ gitea.event.pull_request.head.ref }}
          GITEA_API_URL: ${{ gitea.api_url }}
          REGISTRY_OWNER: ${{ gitea.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          branch_name="${BRANCH_NAME#refs/heads/}"
          branch_tag="$(printf '%s' "${branch_name}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request DELETE \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_API_URL}/packages/${REGISTRY_OWNER}/container/spendee/${branch_tag}")"
          [ "${status}" = "204" ] || [ "${status}" = "404" ]
